name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python3 scripts/gen_traceability.py --check

      - run: python3 scripts/style_lint.py --strict --summary

      - run: python3 scripts/gen_abbreviations.py --check

      - run: python3 scripts/check_dutch.py --strict

      - run: mkdocs build --strict

      - run: python3 scripts/check_diagram_links.py site

      - uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1
        with:
          source-dir: site/
