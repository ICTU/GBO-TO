site_name: Gemeenschappelijke Bronontsluiting

extra:
  version:
    provider: mike
    alias: true
  document_version: "0.2.0"
  document_date: "november 2026"
  document_author: "ICTU"
  document_status: "concept"

theme:
  name: material
  language: custom
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.top
    - toc.integrate
    - content.code.copy
    - content.code.annotate
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.path
    - toc.follow


markdown_extensions:
  - tables
  - footnotes
  - sane_lists
  - pymdownx.highlight:
      anchor_linenums: true
  - admonition
  - attr_list
  # Mermaid diagrammen
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.snippets:
      base_path:
        - docs
        - includes
      check_paths: true
  # Automatische inhoudsopgave
  - toc:
      permalink: true
      toc_depth: 3

site_url: https://ictu.github.io/GBO-TO/
repo_url: https://github.com/ICTU/GBO-TO
repo_name: ictu/gbo-to

extra_css:
  - stylesheets/extra.css
  - stylesheets/pdf.css

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascript/mermaid-init.js
  - javascript/print.js
  - javascript/print-site-toc-fix.js

plugins:
  - search
  - mike:
      canonical_version: "latest"
  - print-site:
      add_to_navigation: false
      print_page_title: "Gemeenschappelijke Bronontsluiting - Technisch Ontwerp"
      add_cover_page: true
      cover_page_template: "docs/assets/templates/voorblad.tpl"
      enumerate_headings: false
      enumerate_figures: false
      add_table_of_contents: false
      toc_title: "Inhoudsopgave"
      toc_depth: 2
      exclude:
        - traceability/coverage.md
        - traceability/findings-closed.md
        - traceability/answered-questions.md

validation:
  links:
    anchors: warn

hooks:
  - hooks/print_site_nav.py

nav:
  - Gemeenschappelijke Bronontsluiting: https://ictu.github.io/GBO/
  - Context: https://ictu.github.io/GBO/latest/context
  - Globaal Ontwerp: https://ictu.github.io/GBO-GO/
  - Projectstartarchitectuur: https://ictu.github.io/GBO-PSA/
